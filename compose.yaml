# Local development only. These credentials must never be used in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: talorys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local or set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: talorys
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talorys -d talorys"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
